set timeout=5
set pager=1

if [ -z "$prefix" ] ; then
  set prefix=($root)/boot/grub
fi

if [ -f ($root)/boot/grub/grub.cfg ] ; then
    set prefix=($root)/boot/grub
    configfile $prefix/grub.cfg
fi

if [ -f (cd0)/boot/grub/grub.cfg ] ; then
    set root=cd0
    set prefix=(cd0)/boot/grub
    configfile $prefix/grub.cfg
fi

if search --no-floppy --label --set=root MACNIX ; then
    if [ -f ($root)/boot/grub/grub.cfg ] ; then
        set prefix=($root)/boot/grub
        configfile $prefix/grub.cfg
    fi
else
    true
fi

for dev in (*) ; do
    if [ -f ($dev)/boot/grub/grub.cfg ] ; then
        set root=$dev
        set prefix=($dev)/boot/grub
        configfile $prefix/grub.cfg
    fi
done

echo "MacNix: grub.cfg bulunamadi, kurtarma kabugu."
sleep 5
