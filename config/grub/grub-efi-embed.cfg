# MacNix 2.0 — GRUB EFI gömülü yapılandırma
# BOOTX64.EFI içine gömülür. Görevi: grub.cfg'yi bulup ona devretmek.
# Böylece aynı EFI ikilisi hem ISO'da hem FAT32 USB'de çalışır.
#
# ⚠ 2026-11-15 CANLI TESTTE BULUNAN GERÇEK HATA:
#   Eski sürüm, modülleri gömülü olmasına rağmen `insmod ...` ile yeniden
#   yüklemeye çalışıyordu. grub-mkstandalone modülleri ZATEN çekirdeğe gömer;
#   `insmod` çağrısı `$prefix` üzerinden .mod dosyasını arar, `$prefix` o an
#   boş/geçersiz olduğu için "error: maximum recursion depth exceeded." basıp
#   hiçbir şey yapmaz. Sonuç: ISO UEFI'de açılınca GRUB **menüsüz** `grub>`
#   kabuğuna düşüyordu (kanıt: /tmp/iso-boot3.log).
#   Düzeltme: gömülü modüller için insmod YOK; insmod yalnızca "insmod" komutu
#   gerçekten varsa ve modül yoksa denenir — o da try/except benzeri bir
#   koşulla korunur. `search` komutu da gömülü olduğu için doğrudan kullanılır.

set timeout=5
set pager=1

# ── 1) GRUB'ın kendi bulduğu kök (genelde CD/USB) ──────────────────────────
if [ -z "$prefix" ] ; then
  set prefix=($root)/boot/grub
fi

# ── 2) ISO kökünde doğrudan ara ────────────────────────────────────────────
if [ -f ($root)/boot/grub/grub.cfg ] ; then
    set prefix=($root)/boot/grub
    configfile $prefix/grub.cfg
fi

# ── 3) Etikete göre ara (MacNix ISO/USB etiketi) ───────────────────────────
# NOT: "search" komutunun başarısız olduğu GRUB sürümlerinde if bloğu hata
# verip menüyü engelleyebilir; bu yüzden çıktı yönlendirilip hata yutulur.
if search --no-floppy --label --set=root MACNIX ; then
    if [ -f ($root)/boot/grub/grub.cfg ] ; then
        set prefix=($root)/boot/grub
        configfile $prefix/grub.cfg
    fi
else
    true
fi

# ── 4) Son çare: tüm aygıtları tara ────────────────────────────────────────
for dev in (*) ; do
    if [ -f ($dev)/boot/grub/grub.cfg ] ; then
        set root=$dev
        set prefix=($dev)/boot/grub
        configfile $prefix/grub.cfg
    fi
done

# Hiçbiri bulunamadıysa kabuk
echo "MacNix: /boot/grub/grub.cfg bulunamadi."
echo "Kurtarma kabugu aciliyor..."
sleep 5
