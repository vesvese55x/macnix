# MacNix 2.0 — GRUB EFI gömülü yapılandırma
# BOOTX64.EFI içine gömülür. Görevi: grub.cfg'yi bulup ona devretmek.
# Böylece aynı EFI ikilisi hem ISO'da hem FAT32 USB'de çalışır.

set timeout=5

insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod iso9660
insmod udf
insmod search
insmod search_fs_uuid
insmod search_fs_file
insmod search_label
insmod normal
insmod configfile
insmod all_video
insmod gfxterm
insmod linux

if [ -z "$prefix" ] ; then
  set prefix=($root)/boot/grub
fi

# 1) ISO / USB kökünde ara
if [ -f /boot/grub/grub.cfg ] ; then
    set prefix=($root)/boot/grub
    configfile $prefix/grub.cfg
fi

# 2) Etikete göre ara
search --no-floppy --label --set=root MACNIX
if [ -f /boot/grub/grub.cfg ] ; then
    set prefix=($root)/boot/grub
    configfile $prefix/grub.cfg
fi

# 3) UUID tabanlı son çare: tüm diskleri tara
for dev in (*) ; do
    if [ -f ($dev)/boot/grub/grub.cfg ] ; then
        set root=$dev
        set prefix=($dev)/boot/grub
        configfile $prefix/grub.cfg
    fi
done

# Hiçbiri bulunamadıysa kabuk
echo "MacNix: /boot/grub/grub.cfg bulunamadi."
echo "Kurtarma kabugu aciliyor..."
sleep 5
