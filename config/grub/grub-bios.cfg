# MacNix 2.0 — GRUB BIOS (legacy) menüsü
# Modern UEFI sistemlerde kullanılmaz; UEFI olmayan eski makineler içindir.
set timeout=5
set default=0

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod linux

terminal_output gfxterm
set gfxmode=auto
set gfxpayload=keep

menuentry "MacNix 2.0 — Kurulumu Başlat (önerilen)" {
    linux  /live/vmlinuz boot=live components quiet splash union=overlay \
           plymouth.enable=1 loglevel=3 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Güvenli Mod (grafik yok)" {
    linux  /live/vmlinuz boot=live components union=overlay nomodeset \
           xmodule=fbdev loglevel=7 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Metin Modu (TTY)" {
    linux  /live/vmlinuz boot=live components union=overlay \
           loglevel=4 noeject noswap macnix.live=1 macnix.nox=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Çekirdek Kayıtları (teşhis)" {
    linux  /live/vmlinuz boot=live components union=overlay \
           ignore_loglevel loglevel=8 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "Yeniden Başlat" {
    reboot
}
