# MacNix 2.0 — ISOLINUX (BIOS/legacy) menüsü
# UEFI olmayan eski makineler için. UEFI sistemlerde bu dosya kullanılmaz.

UI vesamenu.c32
PROMPT 0
TIMEOUT 50
DEFAULT macnix

MENU TITLE MacNix 2.0 — macOS Virtualization Platform
MENU BACKGROUND /isolinux/splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;40   #80ffffff #00000000 std

LABEL macnix
  MENU LABEL ^MacNix 2.0 — Kurulumu Baslat
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash union=overlay \
         noeject noswap macnix.live=1
  TEXT HELP
  macOS sanallastirma platformunu kur.
  ENDTEXT

LABEL safe
  MENU LABEL ^Guvenli Mod (grafik yok)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components nomodeset xmodule=fbdev \
         union=overlay loglevel=7 noeject noswap macnix.live=1
  TEXT HELP
  Ekran karti sorunlarinda kullan.
  ENDTEXT

LABEL tty
  MENU LABEL ^Metin Modu (TTY)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components union=overlay loglevel=4 \
         noeject noswap macnix.live=1 macnix.nox=1

LABEL debug
  MENU LABEL ^Cekirdek Kayitlari (teshis)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components union=overlay \
         ignore_loglevel loglevel=8 noeject noswap macnix.live=1

LABEL reboot
  MENU LABEL ^Yeniden Baslat
  COM32 reboot.c32
