# MacNix 2.0 — GRUB önyükleme menüsü (ISO ve USB ağacı)
# Bu dosya hem ISO'nun /boot/grub/grub.cfg'si hem USB ağacınınki olarak kullanılır.

set timeout=5
set default=0

insmod all_video
insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod linux

terminal_output gfxterm
set gfxmode=auto
set gfxpayload=keep

# ── Görsel tema ─────────────────────────────────────────────────────────────
if loadfont /boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=1024x768,800x600,auto
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# ── Yardımcı: canlı ortam çekirdek parametreleri ─────────────────────────────
# components: live-boot modülleri (squashfs, overlay, filesystem)
# union=overlay: modern overlayfs (aufs değil)
# --- sessiz/grafik ---

menuentry "MacNix 2.0 — Kurulumu Başlat (önerilen)" --class macnix --class os {
    linux  /live/vmlinuz boot=live components quiet splash union=overlay \
           plymouth.enable=1 loglevel=3 vt.global_cursor_default=0 \
           noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Güvenli Mod (grafik yok, sorun giderme)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay nomodeset \
           xmodule=fbdev loglevel=7 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Metin Modu (TTY, X başlatmaz)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay \
           loglevel=4 noeject noswap macnix.live=1 macnix.nox=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Bellekten Çalıştır (toram, yavaş önyükleme)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay toram \
           quiet splash noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 — Çekirdek Kayıtlarını Göster (önyükleme hatası teşhisi)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay \
           ignore_loglevel earlyprintk=efi,keep loglevel=8 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "— Donanım bilgisi / kabuk (kurtarma) —" --class os {
    linux  /live/vmlinuz boot=live components union=overlay \
           loglevel=4 noeject noswap macnix.live=1 macnix.debug=1 single
    initrd /live/initrd.img
}

menuentry "Yeniden Başlat" {
    reboot
}

menuentry "Kapat" {
    halt
}
