# MacNix 2.0 — GRUB önyükleme menüsü (ISO ve USB ağacı)
# Bu dosya hem ISO'nun /boot/grub/grub.cfg'si hem USB ağacınınki olarak kullanılır.

set timeout=5
set default=0

insmod all_video
insmod gfxterm
insmod png
insmod font
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod linux

# ── EKRAN ÇIKIŞI: METİN MODU (bilinçli seçim) ──────────────────────────────
# 2026-11-15 CANLI ÖNYÜKLEME TESTLERİ: `terminal_output gfxterm` bu firmware
# +QEMU VGA kombinasyonunda font yüklü olsa bile HİÇBİR ŞEY çizmiyor; ekran
# tamamen siyah kalıyor ve menü görünmüyor (kullanıcı için "kurulum açılmıyor").
# Üç ayrı ISO'da (v390/v392/v400) aynı sonuç alındı. Bu yüzden Metin modu
# varsayılan yapıldı: her firmware'de, her GPU'da garanti görünür.
# Grafik menü isteyen `terminal_output gfxterm` yazsın (kendi donanımında deneyerek).
set gfxmode=auto
set gfxpayload=keep
terminal_output console
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray


# ── Yardımcı: canlı ortam çekirdek parametreleri ─────────────────────────────
# components: live-boot modülleri (squashfs, overlay, filesystem)
# union=overlay: modern overlayfs (aufs değil)
# --- sessiz/grafik ---

menuentry "MacNix 2.0 - Kurulumu Baslat (onerilen)" --class macnix --class os {
    linux  /live/vmlinuz boot=live components quiet splash union=overlay \
           plymouth.enable=1 loglevel=3 vt.global_cursor_default=0 \
           noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 - Guvenli Mod (grafik yok, sorun giderme)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay nomodeset \
           xmodule=fbdev loglevel=7 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 - Metin Modu (TTY, X baslatmaz)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay \
           loglevel=4 noeject noswap macnix.live=1 macnix.nox=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 - Bellekten Calistir (toram, yavas onyukleme)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay toram \
           quiet splash noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "MacNix 2.0 - Cekirdek Kayitlarini Goster (onyukleme hatasi teshisi)" --class os {
    linux  /live/vmlinuz boot=live components union=overlay \
           ignore_loglevel earlyprintk=efi,keep loglevel=8 noeject noswap macnix.live=1
    initrd /live/initrd.img
}

menuentry "- Donanim bilgisi / kabuk (kurtarma) -" --class os {
    linux  /live/vmlinuz boot=live components union=overlay \
           loglevel=4 noeject noswap macnix.live=1 macnix.debug=1 single
    initrd /live/initrd.img
}

menuentry "Yeniden Baslat" {
    reboot
}

menuentry "Kapat" {
    halt
}
