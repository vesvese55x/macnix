# MacNix 2.0 — oturum açma yapılandırması
# ----------------------------------------------------------------------------
# CANLI ORTAM: canlı hesap "macnix-live" (kurulumda çakışma olmasın diye).
# KURULU SİSTEM: macnix-firstboot.service ilk açılışta bu dosyadaki
# autologin-user değerini "macnix" yapar, ek olarak Calamares'in
# displaymanager job'u /etc/lightdm/lightdm.conf dosyasına da autologin yazar.
#
# KURAL: bu dosyada parola/greeter ile ilgili hiçbir şey kullanıcıya
# sorulmaz — oturum kendiliğinden açılır.
[Seat:*]
autologin-user=macnix-live
autologin-user-timeout=0
autologin-session=openbox
user-session=openbox
greeter-session=lightdm-gtk-greeter
greeter-hide-users=true
allow-guest=false
xserver-command=X -s 0 -dpms -nolisten tcp
