name: MacNix 2.0 — ISO derle ve yayınla

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bundle_assets:
        description: 'OpenCore + kextleri ISO içine göm'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ── 1. Hızlı doğrulama (dakikalar) ──────────────────────────────────────
  validate:
    name: Statik doğrulama + modül testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python bağımlılıkları
        run: python3 -m pip install --quiet pyyaml

      - name: Statik doğrulama
        run: bash tools/validate.sh

      - name: Calamares modül testleri
        run: python3 tools/test-modules.py

      - name: mount yaması regresyon testi
        run: python3 tools/test-mount-patch.py

  # ── 2. ISO derleme ──────────────────────────────────────────────────────
  build:
    name: ISO derle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      iso: ${{ steps.hash.outputs.iso }}
    steps:
      - uses: actions/checkout@v4

      # ÖNEMLİ: GitHub Contents API ile yüklenen dosyalar 644 gelir (exec biti
      # korunmaz). Ayrıca bazı zip indirmeleri de izinleri düşürür. Bu yüzden
      # betikleri burada açıkça çalıştırılabilir yapıyoruz.
      - name: Betik izinleri
        run: |
          chmod +x build.sh tools/*.sh tools/*.py scripts/*.sh scripts/bin/* \
                   calamares/modules/*/main.py plymouth/macnix/*.py 2>/dev/null || true
          ls -l build.sh | awk '{print $1, $NF}'

      - name: Derleme bağımlılıkları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
            isolinux syslinux-common syslinux-utils zstd xz-utils

      # NOT: Burada HİÇBİR `sed` yaması yok.
      # Eski sürümlerde live-build 7 adet sed ile yamalanıyor ve hepsi
      # `|| true` ile yutuluyordu → sessizce bozuk ISO üretiyordu.
      # MacNix 2.0 live-build kullanmıyor; build.sh kendi başına çalışır.
      - name: ISO derle
        env:
          BUNDLE_ASSETS: ${{ github.event.inputs.bundle_assets || '1' }}
          MACNIX_JOBS: 4
        run: |
          sudo -E WORK="$RUNNER_TEMP/build" OUT="$PWD/out" USB_TREE=1 \
            ./build.sh

      - name: Sürüm + SHA256
        id: hash
        run: |
          ISO=$(ls out/*.iso | head -1)
          echo "iso=$(basename "$ISO")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ISO" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "### MacNix ISO" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$(basename "$ISO")  $(du -h "$ISO" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$ISO" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: ISO yapısını doğrula
        run: |
          ISO=$(ls out/*.iso)
          echo "ISO: $ISO ($(du -h "$ISO" | cut -f1))"
          xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null \
            | grep -E 'El Torito img path' | tee /tmp/et.txt
          grep -q 'efi.img'  /tmp/et.txt || { echo "::error::UEFI ön yükleme yok"; exit 1; }
          grep -q 'bios.img' /tmp/et.txt || { echo "::warning::BIOS ön yükleme yok"; }
          xorriso -indev "$ISO" -ls /live 2>/dev/null | grep -q filesystem.squashfs \
            || { echo "::error::filesystem.squashfs yok"; exit 1; }

      - name: Artefakt yükle
        uses: actions/upload-artifact@v4
        with:
          name: macnix-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14

  # ── 3. Release ──────────────────────────────────────────────────────────
  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Artefaktı indir
        uses: actions/download-artifact@v4
        with:
          name: macnix-iso
          path: out

      - name: Sürüm etiketini oku
        id: ver
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-${{ github.run_number }}
          name: MacNix ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          body: |
            ## MacNix ${{ steps.ver.outputs.v }}

            macOS'u Linux üzerinde bir sanal makinede çalıştıran kurulum sistemi.

            **ISO:** `${{ needs.build.outputs.iso }}`
            **SHA256:** `${{ needs.build.outputs.sha256 }}`

            ### Doğrulanmış
            - BIOS + UEFI hibrit önyükleme
            - Calamares kurulumu: bölümleme, unpackfs, kullanıcı, GRUB (EFI **ve** BIOS)
            - UEFI yedek önyükleyici `\EFI\BOOT\BOOTX64.EFI` (boş NVRAM'de de açılır)
            - Kurulu sistem BIOS'tan ve UEFI'den açılıyor

            ### Henüz test edilmedi
            - macOS'un gerçekten kurulup açılması
            - VFIO GPU passthrough (uyumlu AMD kart gerekir)
            - Gerçek donanımda kurulum

            GPU hızlandırma yalnızca Apple sürücüsü olan AMD kartlarda
            (RX 580 / 6600+) mümkündür. Diğer tüm GPU'larda macOS yazılım
            render ile açılır — bu bir hata değil, Apple'ın sürücü modelinin
            sonucudur.

            Bütünlük: `sha256sum -c macnix-2.0.0-amd64.iso.sha256`
          files: |
            out/*.iso
            out/*.sha256
          draft: false
          prerelease: false
      # NOT: `env` blokları adım (step) düzeyinde olmalı; `with:` içine
      # yazılırsa GitHub'ın şema doğrulayıcısı reddeder:
      #   "failed to parse workflow: A mapping was not expected"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
