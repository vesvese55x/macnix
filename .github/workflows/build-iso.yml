name: MacNix 2.0 — ISO

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bundle_assets:
        description: 'OpenCore + kextleri ISO içine göm'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: Statik doğrulama + modül testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python ve YAML bağımlılıkları
        run: |
          python3 -m pip install --quiet pyyaml

      - name: Statik doğrulama (62 denetim)
        run: bash tools/validate.sh

      - name: Calamares modül testleri (sahte libcalamares)
        run: python3 tools/test-modules.py

  build:
    name: ISO derle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Derleme bağımlılıkları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
            isolinux syslinux-common syslinux-utils zstd xz-utils

      # ÖNEMLİ: burada HİÇBİR `sed` yaması yok.
      # Orijinal iş akışı live-build'i 7 adet sed ile yamalıyordu ve hepsi
      # `|| true` ile yutuluyordu; sonuç sessizce bozuk ISO'ydu.
      # MacNix 2.0 live-build kullanmıyor.
      - name: ISO derle
        env:
          BUNDLE_ASSETS: ${{ github.event.inputs.bundle_assets || '1' }}
          MACNIX_JOBS: 4
        run: |
          sudo -E WORK="$RUNNER_TEMP/build" OUT="$PWD/out" USB_TREE=1 \
            ./build.sh

      - name: ISO yapısını doğrula
        run: |
          ISO=$(ls out/*.iso)
          echo "ISO: $ISO ($(du -h "$ISO" | cut -f1))"
          # hibrit önyükleme: hem BIOS hem UEFI El Torito girdisi olmalı
          xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null \
            | grep -E 'El Torito img path' | tee /tmp/et.txt
          grep -q 'bios.img' /tmp/et.txt || { echo "::warning::BIOS önyükleme yok"; }
          grep -q 'efi.img'  /tmp/et.txt || { echo "::error::UEFI önyükleme yok"; exit 1; }
          # canlı sistem dosyaları
          xorriso -indev "$ISO" -ls /live 2>/dev/null | grep -q filesystem.squashfs \
            || { echo "::error::filesystem.squashfs yok"; exit 1; }

      - name: Artefakt yükle
        uses: actions/upload-artifact@v4
        with:
          name: macnix-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14

      - name: Release oluştur
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MacNix 2.0 (latest)
          body: |
            MacNix 2.0 — macOS sanallaştırma platformu.

            - Hibrit ISO (UEFI + BIOS önyükleme)
            - Calamares kurulum akışı: `unpackfs` düzeltildi
            - OpenCore + kextler + AMD yamaları ISO içinde gömülü
            - GPU'su desteklenmeyen makinelerde yazılım render modu

            `sha256sum` dosyası ile bütünlüğü doğrulayın.
          files: |
            out/*.iso
            out/*.sha256
          draft: false
          prerelease: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
