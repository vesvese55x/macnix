# ============================================================================
#  MacNix 2.0 — Calamares 3.2 akış tanımı
# ============================================================================
#  Debian 12 (calamares 3.2.61) gerçekleri — hepsi canlı testte doğrulandı:
#
#  1) Python modülleri YALNIZCA "job" arayüzünü destekler. Debian paketi
#     PythonQt ile derlenmediği için "viewmodule + interface: python" YOKTUR.
#     Eski settings.conf böyle bir görünüm modülü (macnix-welcome) tanımlıyordu:
#       ERROR: Bad interface "python" for module type "view"
#       → "Calamares Initialization Failed" → KURULUM HİÇ AÇILMIYORDU.
#
#  2) "notes" modülü Debian'da yok (yalnızca notesqml). Notlar artık QML ile
#     gösteriliyor: calamares/qml/notes.qml
#
#  3) "instances:" kaydı eksik tanımlıydı (module: satırı yoktu). Kaldırıldı;
#     canlı medya keşfi düz shellprocess ile yapılıyor (shellprocess.conf).
#
#  4) Yerel modüller ÇOK MİMARİLİ dizine kurulur:
#     /usr/lib/<multiarch>/calamares/modules — modules-search'e eklenir.
#
#  5) SIRA ÖĞELERİ SÖZLÜK OLAMAZ. Calamares 3.2'de exec listesine
#       - id: macnix-efi-fallback
#         module: shellprocess
#         config: macnix-efi-fallback.conf
#     yazıldığında açılışta şu hatayı verip HİÇ AÇILMIYOR:
#       WARNING: Invalid instance in *sequence*
#       Calamares has invalid settings, shutting down.
#     (Bu hata GitHub Actions'ta derlenen ISO'nun canlı testinde yakalandı.)
#     Aynı modülü farklı yapılandırmayla ikinci kez çalıştırmanın doğru yolu
#     `instances:` + sırada o örneğin ADINI kullanmaktır. NE YAZIK Kİ bu da
#     yetmedi: shellprocess örneği canlı testte
#       Calamares Initialization Failed
#       The following modules could not be loaded:
#         • macnix-efi-fallback@macnix-efi-fallback
#     verdi. Bu yüzden adım artık YEREL PYTHON JOB modülü
#     (calamares/modules/macnix-efi-fallback) — gpu-detect/gpu-config gibi.
# ----------------------------------------------------------------------------
---
modules-search: [ local, /usr/lib/@MULTIARCH@/calamares/modules ]

sequence:
  # DİKKAT: her adım KENDİ satırında "- <modül>" olarak yazılmalı. Daha önce
  # "# yerleşik (C++) karşılama ekranı." gibi açıklamalar aynı satırda değil
  # ALT satırdaydı ve Calamares bunları "WelcomeToTheMacNix..." gibi SAHTE
  # adım adları olarak yan menüye bastı (canlı VM ekran görüntüsü: 05/06).
  # Bu yüzden açıklamalar burada değil, dosyanın sonundaki "NOTLAR" bölümünde.
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess
      - unpackfs
      - removeuser
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - macnix-gpu-detect
      - macnix-gpu-config
      - bootloader
      - macnix-efi-fallback
      - umount
  - show:
      - license
      - finished

branding: macnix
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

# ── AKIŞ NOTLARI (2026-11-14) ──────────────────────────────────────────────
# • welcome / finished / license = Calamares'in YERLEŞİK (C++) modülleri.
#   QML tabanlı welcomeq/finishedq/notesqml canlı VM'de QML yükleyemedi
#   ("Welcome Loading failed.") → kullanılmıyor. QML dosyaları marka
#   dizininde duruyor (incelenebilirlik), akışta değil.
# • "notes" modülü Calamares'te YOK (ne 3.2.61 ne 3.3.x) → bilgilendirme
#   görevini slaytlar (show.qml) ve karşılama metni yapıyor.
# • license modülü: ZORUNLU KREDİ metni burada gösterilir
#   (calamares/module-conf/license.conf) — kullanıcı kabul eder.
# • removeuser: canlı ortamdaki macnix hesabı kurulum öncesi temizlenir.
