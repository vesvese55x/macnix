# MacNix 2.0 — disk bölümleme
# NOT: initialSwapChoice değeri Calamares 3.2 NamedEnumTable'da
#      "none" DEĞİL "no" olarak adlandırılmıştır. "none" yazıldığında
#      "Configuration for *initialSwapChoice* is not one of the
#      *userSwapChoices*" uyarısı çıkıyordu.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"
userSwapChoices:
  - none
  - small
  - file
  - suspend
initialSwapChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType: ext4
availableFileSystemTypes:
  - ext4
  - btrfs
  - xfs
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
