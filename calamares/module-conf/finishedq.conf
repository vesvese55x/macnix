# MacNix 2.0 — bitiş ekranı (finishedq)
# Bitir düğmesi kendi QML'imizde (finishedq.qml); yeniden başlatmayı
# Calamares'in finished modülü yapar (restartNowCommand).
#
# restartNowMode: user-unchecked
#   → kimse dokunmazsa kapanışta YENİDEN BAŞLATMAZ. QML'deki
#     "Bitir ve Yeniden Başlat" düğmesi restartNowWanted = true yapar.
#   → ÖNEMLİ: 30 saniyelik geri sayım YALNIZCA "always" modunda anlamlı;
#     "user-unchecked" ile de geri sayım çalışır çünkü QML açıkça
#     Config::restartNowWanted'i true'ya çeker (canlı kaynak: finished/Config.cpp).
---
qmlSearch: branding
qmlFilename: "finishedq"
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
