# MacNix 2.0 — bitiş ekranı (C++ finished modülü)
# ---------------------------------------------------------------------------
# restartNowMode: user-unchecked
#   → kullanıcı işaretlemezse yeniden başlatmaz; işaretlerse yeniden başlatır.
#     (Eski "restartNowEnabled/restartNowChecked" anahtarları Calamares 3.2
#      tarafından okunmuyordu — modül varsayılanı kullanıyordu.)
# restartNowCommand: "true"
#   → BİLİNÇLİ: yeniden başlatma komutu gerçek reboot yerine "true". Kurulum
#     bittikten sonra makine kapanmıyor; Calamares açık kalıp "Bitti" durumunu
#     gösteriyor ve kullanıcı hazır olduğunda kapatıyor. Gerçek makinede
#     yeniden başlatmayı kullanıcı kendisi yapar (macOS kurulumu ilk açılışta
#     zaten kendiliğinden başlar). Yeniden başlatma istenirse bu satırı
#     "systemctl -i reboot" yapın.
---
restartNowMode: user-unchecked
restartNowCommand: "true"
notifyOnFinished: false
