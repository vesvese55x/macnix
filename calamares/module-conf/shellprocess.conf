# MacNix 2.0 — canlı medyayı keşfet (Calamares exec adımı)
# ---------------------------------------------------------------------------
# live-boot ISO'yu /run/live/medium altına bağlar; eski live-boot sürümleri
# /lib/live/mount/medium kullanır. Ventoy / elle bağlanan durumlar için
# /cdrom, /src ve /media, /run/media, /mnt altına da bakıyoruz.
#
# Bulunan dizin /run/macnix-live sembolik linki olarak bağlanır; unpackfs
# modülü squashfs'i oradan okur. Bulunamazsa kurulum DURUR (sessizce
# bozuk bir sistem kurmaktansa açık hata vermek doğrudur).
# ---------------------------------------------------------------------------
dontChroot: true
timeout: 90
script:
  - "/bin/sh"
  - "-c"
  - "set -e; rm -f /run/macnix-live; for d in /run/live/medium /lib/live/mount/medium /run/live/rootfs /cdrom /src; do if [ -f \"$d/live/filesystem.squashfs\" ]; then ln -sfn \"$d/live\" /run/macnix-live; printf 'MacNix: canli medya -> %s/live\\n' \"$d\"; exit 0; fi; done; for d in /media/* /run/media/* /mnt/*; do if [ -f \"$d/live/filesystem.squashfs\" ]; then ln -sfn \"$d/live\" /run/macnix-live; printf 'MacNix: canli medya -> %s/live\\n' \"$d\"; exit 0; fi; done; printf 'MacNix HATA: filesystem.squashfs hicbir yerde bulunamadi. ISO bir USBye dd/Rufus-DD ile yazilmalidir.\\n' >&2; ls -la /run/live 2>/dev/null || true; exit 1"
