# MacNix 2.0 — karşılama ekranı (welcomeq)
# qmlFilename UZANTISIZ: Calamares ".qml" ekini kendisi ekler.
---
qmlSearch: branding
qmlFilename: "welcome"
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false
requirements:
    requiredStorage:    25
    requiredRam:        4.0
    check:
        - storage
        - ram
        - root
        - screen
    required:
        - storage
        - root
