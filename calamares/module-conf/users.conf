# ============================================================================
#  MacNix 2.0 — kullanıcı hesabı (users)
# ============================================================================
#  AMAÇ: kurulumda HİÇBİR ŞEY SORULMASIN. Canlı testte kullanıcı hem kurulum
#  sırasında hesap/parola uydurmak zorunda kalıyordu hem de kurulumdan sonra
#  açılışta gelen kullanıcı adı/parola penceresinde takılıyordu (canlı test:
#  "Your password is incorrect" ekranı, image-7.png).
#
#  Çözüm üç katmanlı:
#   1) doAutologin: true            → lightdm oturumu kendiliğinden açar
#      (displaymanager job'u /etc/lightdm/lightdm.conf'a yazar)
#   2) allowWeakPasswords*: true    → parola denetimleri gevşek
#      passwordRequirements.nonempty hiç verilmez → BOŞ parola kabul edilir
#      (kaynak: users/Config.cpp passwordStatus(); boş parolada tek hata
#       "nonempty" denetimidir, o da tanımlı değilse parola geçerlidir)
#   3) macnix-firstboot.service → ilk açılışta "passwd -d" ile parolayı
#      tamamen kaldırır (boş parola = parola sorulmaz)
#
#  Kullanıcı adı/makine adı hâlâ serbest metin: kullanıcı isterse değiştirir,
#  istemezse önerilen "macnix" ile devam eder. Parola alanı boş bırakılabilir.
# ----------------------------------------------------------------------------
---
userGroup: users
autologinGroup: autologin
sudoersGroup: sudo
defaultGroups:
  - users
  - lp
  - dialout
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - disk
  - input
  - kvm
setRootPassword: false
doAutologin: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
# DİKKAT: buraya "nonempty" anahtarı EKLENMEMELİ. Debian Calamares 3.2.61'de
# tanınan anahtarlar: nonempty, minLength, maxLength, libpwquality. "nonempty"
# verilirse (true/false) boş parola denetimi devreye girer; biz HİÇ vermiyoruz →
# boş parola geçerli olur ve kullanıcı parola uydurmak zorunda kalmaz.
passwordRequirements:
  minLength: -1
  maxLength: -1
