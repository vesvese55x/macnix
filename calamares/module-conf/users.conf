# MacNix 2.0 — kullanıcı hesabı
# Calamares 3.2 parola denetim anahtarları "passwordRequirements" DEĞİL,
# üst düzey anahtarlardır. Eski dosya "Unknown password-check key" uyarıları
# üretiyordu ve allowWeakPasswords hiç okunmuyordu.
---
userGroup: users
autologinGroup: autologin
sudoersGroup: sudo
defaultGroups:
  - users
  - lp
  - dialout
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - disk
  - input
  - kvm
setRootPassword: false
doAutologin: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
  minLength: 4
  maxLength: -1
