# MacNix 2.0 — UEFI önyükleme yedeği (\EFI\BOOT\BOOTX64.EFI)
# ---------------------------------------------------------------------------
# NEDEN GEREKLİ (ölçüldü, tahmin değil):
# bootloader.conf içindeki `installEFIFallback: true` anahtarı Debian'ın
# Calamares 3.2 derlemesinde TANINMIYOR — bu yüzden GRUB yalnızca
# \EFI\MacNix\grubx64.efi olarak yazılıyor. Sonuç: NVRAM girdisi olmayan
# (veya UEFI menüsünde girdi silinmiş) makinelerde firmware, taşınabilir
# medya dışındaki disklerde yedek yol olan \EFI\BOOT\BOOTX64.EFI'yi arıyor ve
# bulamayınca doğrudan UEFI kabuğuna düşüyor.
#
# VM testinde birebir gözlendi:
#     UEFI Interactive Shell v2.2 → Shell> (sistem açılmıyor)
#     Shell> fs0:\EFI\MacNix\grubx64.efi   → GRUB açıldı, sistem sorunsuz açıldı
#     → sorun GRUB'da değil, yedek EFI yolunun eksikliğinde.
#
# Bu adım bootloader'dan SONRA, hedef sistemde (chroot) çalışır ve yedeği
# atar. Zaten varsa dokunmaz; hata durumunda kurulumu DURDURMAZ (loglar).
# ---------------------------------------------------------------------------
dontChroot: false
timeout: 60
script:
  - "/bin/sh"
  - "-c"
  - "set -u; EFI=/boot/efi; [ -d \"$EFI/EFI\" ] || { echo 'MacNix: EFI bolumu bagli degil — yedek atlandi'; exit 0; }; SRC=$(find \"$EFI/EFI\" -maxdepth 2 -name grubx64.efi -o -maxdepth 2 -name grubia32.efi 2>/dev/null | head -1); if [ -z \"$SRC\" ]; then echo 'MacNix: grubx64.efi bulunamadi — yedek atlandi (BIOS kurulumu olabilir)'; exit 0; fi; case \"$SRC\" in *grubia32.efi) DST=\"$EFI/EFI/BOOT/BOOTIA32.EFI\";; *) DST=\"$EFI/EFI/BOOT/BOOTX64.EFI\";; esac; mkdir -p \"$EFI/EFI/BOOT\"; if [ -f \"$DST\" ]; then echo \"MacNix: yedek zaten var -> $DST\"; else cp \"$SRC\" \"$DST\" && echo \"MacNix: UEFI yedek olusturuldu -> $DST\"; fi; ls -l \"$EFI/EFI/BOOT\" 2>/dev/null || true"
